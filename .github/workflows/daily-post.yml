name: Daily AI Threads Post

on:
  schedule:
    - cron: '0 12 * * *'  # 每天 UTC 12:00 = 台灣時間晚上 8 點
  workflow_dispatch:        # 允許手動觸發

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r AI_Threads_Agent/requirements.txt

      - name: Install Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          echo "FONT_PATH=$(find /usr/share/fonts -name '*CJK*Regular*' | head -1)" >> $GITHUB_ENV

      - name: Generate content and image
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONUTF8: "1"
        run: |
          cd AI_Threads_Agent
          python agent.py --dry-run

      - name: Commit generated image to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/maggie00214/ai-threads-agent.git
          git pull origin main --rebase
          git add 每日內容/
          git diff --staged --quiet || git commit -m "Daily post $(date +%Y%m%d)"
          git push origin main

      - name: Publish to Threads via API
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GITHUB_REPO: maggie00214/ai-threads-agent
          PYTHONUTF8: "1"
        run: |
          cd AI_Threads_Agent
          python publish_github.py
