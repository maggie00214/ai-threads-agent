name: Daily AI Threads Post Workflow

"on":
  schedule:
    - cron: '7 12 * * *'
    - cron: '37 13 * * *'
  workflow_dispatch:

concurrency:
  group: daily-ai-threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r AI_Threads_Agent/requirements.txt

      - name: Install Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          echo "FONT_PATH=$(find /usr/share/fonts -name '*CJK*Regular*' | head -1)" >> $GITHUB_ENV

      - name: Check whether today's post already exists
        id: check_today
        run: |
          TODAY=$(date +%Y%m%d)

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "already_posted=false" >> "$GITHUB_OUTPUT"
            echo "Manual run. Skip duplicate check."
            exit 0
          fi

          git fetch origin images --depth=1 2>/dev/null || true

          if git show "origin/images:每日內容/${TODAY}/log.json" > /tmp/existing_log.json 2>/dev/null; then
            POST_ID=$(python3 -c "import json; import sys; data=json.load(open('/tmp/existing_log.json', encoding='utf-8')); print(data.get('post_id', ''))")
            if [ -n "$POST_ID" ]; then
              echo "already_posted=true" >> "$GITHUB_OUTPUT"
              echo "existing_post_id=$POST_ID" >> "$GITHUB_OUTPUT"
              echo "Today's post already exists: $POST_ID"
              exit 0
            fi
          fi

          echo "already_posted=false" >> "$GITHUB_OUTPUT"

      - name: Generate content and image
        if: steps.check_today.outputs.already_posted != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONUTF8: "1"
        run: |
          cd AI_Threads_Agent
          python agent.py --dry-run

      - name: Publish images to images branch
        if: steps.check_today.outputs.already_posted != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date +%Y%m%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/maggie00214/ai-threads-agent.git

          # 備份今日產出的整組圖片與 log
          mkdir -p /tmp/daily/${TODAY}/images
          cp -R 每日內容/${TODAY}/images/. /tmp/daily/${TODAY}/images/
          cp 每日內容/${TODAY}/log.json /tmp/daily/${TODAY}/

          # 清除 working tree 與未追蹤檔，讓 branch 切換不報錯
          git reset --hard HEAD
          git clean -fd

          # 切換到 images 孤立分支
          git fetch origin images 2>/dev/null || true
          if git ls-remote --exit-code origin images 2>/dev/null; then
            git checkout -B images origin/images
          else
            git checkout --orphan images
            git rm -rf .
          fi

          # 放入今日整組圖片（用唯一檔名，不會被 CDN 快取）
          mkdir -p 每日內容/${TODAY}/images
          cp -R /tmp/daily/${TODAY}/images/. 每日內容/${TODAY}/images/
          cp /tmp/daily/${TODAY}/log.json 每日內容/${TODAY}/

          git add 每日內容/
          git commit --allow-empty -m "Daily images ${TODAY}"
          git push --force origin images

          # 切回 main 還原 Python 環境
          git checkout main

          # 還原剛才生成的圖片與 log，供後續發布步驟使用
          mkdir -p 每日內容/${TODAY}/images
          cp -R /tmp/daily/${TODAY}/images/. 每日內容/${TODAY}/images/
          cp /tmp/daily/${TODAY}/log.json 每日內容/${TODAY}/log.json

      - name: Publish to Threads via API
        if: steps.check_today.outputs.already_posted != 'true'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GITHUB_REPO: maggie00214/ai-threads-agent
          PYTHONUTF8: "1"
        run: |
          cd AI_Threads_Agent
          python publish_github.py

      - name: Persist published log to images branch
        if: steps.check_today.outputs.already_posted != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date +%Y%m%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/maggie00214/ai-threads-agent.git

          cp 每日內容/${TODAY}/log.json /tmp/daily/${TODAY}/published_log.json
          git reset --hard HEAD
          git clean -fd

          git fetch origin images 2>/dev/null || true
          if git ls-remote --exit-code origin images 2>/dev/null; then
            git checkout -B images origin/images
          else
            git checkout --orphan images
            git rm -rf .
          fi

          mkdir -p 每日內容/${TODAY}
          cp /tmp/daily/${TODAY}/published_log.json 每日內容/${TODAY}/log.json
          git add 每日內容/${TODAY}/log.json
          git commit --allow-empty -m "Persist published log ${TODAY}"
          git push --force origin images

      - name: Report skipped run
        if: steps.check_today.outputs.already_posted == 'true'
        run: |
          echo "Skip publish. Today's post already exists: ${{ steps.check_today.outputs.existing_post_id }}"
